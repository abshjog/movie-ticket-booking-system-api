<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your OTP Code</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f5; padding: 40px 20px; margin: 0;">

<div style="max-width: 500px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center;">

    <h2 style="color: #111827; margin-top: 0;">Welcome back to <span th:text="${companyName}">CinePass</span>!</h2>

    <p style="color: #4b5563; font-size: 16px; margin-bottom: 30px;">
        Your One-Time Password (OTP) for login is:
    </p>

    <div style="background-color: #eef2ff; border: 1px dashed #6366f1; border-radius: 8px; padding: 15px; margin-bottom: 30px;">
        <h1 style="color: #4f46e5; letter-spacing: 8px; margin: 0; font-size: 32px;" th:text="${otpCode}">
            123456
        </h1>
    </div>

    <p style="color: #6b7280; font-size: 14px; margin-bottom: 0;">
        This OTP is valid for 5 minutes.<br>Please do not share it with anyone.
    </p>

</div>

</body>
</html>
